# Varsayılan proje ayarları. .env değerleri (LLM_PROVIDER, DEV_MODEL, ...) bu dosyayı ezer.
seed: 42

llm:
  provider: ollama              # ollama | openai
  dev_model: llama3.1:8b
  experiment_model: gpt-4o-mini
  ollama_base_url: http://localhost:11434/v1
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 60

paths:
  data_dir: data
  raw_dir: data/raw
  scenarios_dir: data/scenarios
  labels_dir: data/labels
  processed_dir: data/processed
  results_dir: results
  external_dir: external
  venue_db: data/processed/venues.json

generation:
  n_venues: 90                  # mock mekan sayısı (her etkinlik türünden eşit)
  n_users_min: 2
  n_users_max: 4
  conflict_rate: 0.5            # çakışmalı senaryo oranı (türler eşit dağıtılır)
  near_miss_rate: 0.5           # çakışmasız senaryoların ne kadarı "zor negatif" çift içerir
  window_start: "2026-12-04"    # planlama penceresi (cuma)
  window_days: 10
