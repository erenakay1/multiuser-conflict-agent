# Varsayılan proje ayarları. .env değerleri (LLM_PROVIDER, DEV_MODEL, ...) bu dosyayı ezer.
seed: 42

llm:
  provider: ollama              # ollama | openai
  dev_model: llama3.1:8b
  experiment_model: gpt-4o-mini
  ollama_base_url: http://localhost:11434/v1
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 60

paths:
  data_dir: data
  raw_dir: data/raw
  scenarios_dir: data/scenarios
  labels_dir: data/labels
  processed_dir: data/processed
  results_dir: results
  external_dir: external
  venue_db: data/processed/venues.json
