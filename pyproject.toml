[project]
name = "mucon"
version = "0.1.0"
description = "Eşit yetkili çok kullanıcılı LLM agent'larında talimat çakışmalarının koordinasyonu"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Eren Akay" }, { name = "Yusuf Daşdemir" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# DeBERTa/NLI dedektörü için (H6): `uv sync --extra ml`
ml = ["transformers>=4.44", "torch>=2.3", "datasets>=2.20"]

[dependency-groups]
# `uv sync` dev grubunu varsayılan olarak kurar
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mucon = "mucon.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mucon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["external", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Türkçe karakterler (ı, ş, ğ ...) docstring/yorumlarda yanlış alarm vermesin
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mucon"]

[tool.ruff.format]
quote-style = "double"
